services:
  - type: web
    name: activeacq
    runtime: node
    plan: starter
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false    # set in the Render dashboard (use internal URL)
      - key: SESSION_SECRET
        generateValue: true
      - key: SEED_TOKEN
        generateValue: true   # required for /api/admin/* endpoints; view in dashboard
