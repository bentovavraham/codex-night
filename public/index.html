<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Active Acquisitions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel via CDN (no build step). -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.3/babel.min.js"></script>

    <!-- Our app. Loaded in dependency order with data-type="module"-style JSX. -->
    <script type="text/babel" data-presets="react" src="/js/api.js"></script>
    <script type="text/babel" data-presets="react" src="/js/util.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/SmartSearch.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Dropzone.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Login.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/ProjectList.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Dashboard.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Budget.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Invoices.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/ChangeOrders.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/TMCharges.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Expenses.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Contracts.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Toast.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Project.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/Admin.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/AlertsDrawer.js"></script>
    <script type="text/babel" data-presets="react" src="/js/components/DropScreen.js"></script>
    <script type="text/babel" data-presets="react" src="/js/app.js"></script>
  </body>
</html>
